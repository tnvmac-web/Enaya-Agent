[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enaya-agent"
version = "0.1.0"
description = "Task-delegation AI agent with multi-agent orchestration, research pipeline, and planning engine"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [
    { name = "tnvmac", email = "tnvmac@web.com" }
]
maintainers = [
    { name = "tnvmac", email = "tnvmac@web.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "click>=8.1",
    "chromadb>=0.5",
    "networkx>=3.2",
    "watchdog>=3.0",
    "openai>=1.30",
    "anthropic>=0.25",
    "httpx>=0.27",
    "requests>=2.31",
    "arxiv>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jsonlines>=4.0",
    "tenacity>=8.2",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "playwright>=1.40",
]
cli = ["nodeenv>=1.9"]
browser = ["playwright>=1.40"]
docker = ["python-docker>=0.7"]
local-embeddings = ["sentence-transformers>=3.0"]
tui = ["textual>=0.70", "textual-dev"]
dashboard = ["fastapi>=0.100", "uvicorn>=0.23", "websockets>=11"]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
acp = ["pydantic>=2.7"]
gateway = ["python-telegram-bot>=20", "discord.py>=2.3", "slack-sdk>=3", "matrix-nio>=0.20", "aiohttp>=3.8"]
voice = ["faster-whisper>=1.0", "groq>=0.4", "elevenlabs>=0.3", "mistral>=0.3", "xai>=0.1", "openai-tts>=0.1"]
image_gen = ["fal-client>=0.1"]
mcp = ["mcp>=0.1", "anyio>=4"]

[project.entry-points]
console_scripts = { "enaya" = "enaya.cli.main:cli" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["enaya*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "C9"]
ignore = ["C901", "ARG001", "ARG002", "TRY003"]
per-file-ignores = { "tests/*" = ["S101", "SLF001"], "enaya/cli/*" = ["TRY003"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = [
    "var-annotated",
    "no-any-return",
    "arg-type",
    "dict-item",
    "union-attr",
    "assignment",
    "return-value",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "src/enaya/cli/*",
    "src/enaya/gateway/*",
    "src/enaya/acp_adapter/*",
    "src/enaya/agent/*",
    "src/enaya/delegation/*",
    "src/enaya/memory/*",
    "src/enaya/planning/*",
    "src/enaya/research/*",
    "src/enaya/plugins/*",
    "src/enaya/tools/*",
    "src/enaya/voice/*",
    "src/enaya/browser/*",
    "src/enaya/image_gen/*",
    "src/enaya/dashboard/*",
    "src/enaya/api_server/*",
    "src/enaya/tui/*",
    "src/enaya/vision/*",
    "src/enaya/hooks/*",
    "src/enaya/cron/*",
    "src/enaya/kanban/*",
    "src/enaya/mcp/*",
    "src/enaya/pets/*",
    "src/enaya/themes/*",
]

[tool.coverage.report]
fail_under = 0
show_missing = true

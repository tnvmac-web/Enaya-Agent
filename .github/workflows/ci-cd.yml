name: Enaya Agent CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect changed areas
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changes
        id: classify
        run: echo "python=true" >> "$GITHUB_OUTPUT"

  # Main test job
  tests:
    name: Python Tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v
        env:
          OPENROUTER_API_KEY: ""
          NVIDIA_API_KEY: ""

  # Lint job
  lint:
    name: Python Lint
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run Ruff (syntax & critical errors)
        run: |
          source .venv/bin/activate
          ruff check src/enaya tests --select=E,F --ignore=E501,E402

      - name: Run Ruff (format check)
        run: |
          source .venv/bin/activate
          ruff format --check src/enaya tests

  # Build verification
  build:
    name: Build Package
    needs: [tests, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install build dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Build package
        run: |
          source .venv/bin/activate
          python -m build

      - name: Verify package installs
        run: |
          source .venv/bin/activate
          ls -la dist/
          pip install dist/*.whl
          enaya --help

  # Security scan (non-blocking)
  security:
    name: Security Scan
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --locked --python 3.11 --extra dev
          uv pip install bandit pip-audit

      - name: Run Bandit
        run: |
          source .venv/bin/activate
          bandit -r src/enaya -f json -o bandit-report.json || true

      - name: Run pip-audit
        run: |
          source .venv/bin/activate
          pip-audit -f json -o pip-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # Gate job - aggregates all results
  all-checks-pass:
    name: All Checks Pass
    needs: [detect, tests, lint, build, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          python3 .github/scripts/evaluate_checks.py